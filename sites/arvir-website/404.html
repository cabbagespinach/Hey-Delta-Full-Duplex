<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>
<style>
  :root{--bg:#0b0f17;--ink:#e8edf6;--dim:#9aa7bd;--accent:#4f8cff;--accent-2:#39d3c0;--line:rgba(148,163,184,.14)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(800px 400px at 50% -10%, rgba(79,140,255,.18), transparent 60%),
      var(--bg);
    color:var(--ink);min-height:100vh;display:grid;place-items:center;
    -webkit-font-smoothing:antialiased;
  }
  .card{text-align:center;padding:40px 24px;max-width:440px}
  .code{
    font-size:clamp(4rem,14vw,6.5rem);font-weight:800;letter-spacing:-.04em;line-height:1;
    background:linear-gradient(120deg,#fff,#bcd4ff 40%,var(--accent-2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h1{font-size:1.4rem;font-weight:700;margin:18px 0 8px}
  p{color:var(--dim);font-size:.98rem;margin-bottom:26px}
  .btn{
    display:inline-flex;align-items:center;gap:9px;font-size:.95rem;font-weight:650;
    padding:12px 24px;border-radius:12px;color:#fff;
    background:linear-gradient(135deg,var(--accent),#6d5efc);
    transition:transform .18s,box-shadow .18s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(79,140,255,.4)}
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>This page doesn't exist</h1>
    <p>The page you're looking for was moved, renamed, or never quite made it to production.</p>
    <a href="index.html" class="btn">← Back to home</a>
  </div>
</body>
</html>
